name: Build Portable Windows Desktop App (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build Executable via PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "MANDOROS_Desktop" `
            --add-data "assets;assets" `
            --add-data "schema;schema" `
            --add-data "static;static" `
            --hidden-import "openpyxl" `
            --hidden-import "plotly" `
            --hidden-import "scipy.stats" `
            --hidden-import "curl_cffi" `
            --hidden-import "pyalex" `
            run_desktop_app.py

      - name: Upload Desktop App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MANDOROS_Windows_Desktop_App
          path: dist/MANDOROS_Desktop/
